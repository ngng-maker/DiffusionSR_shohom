# DiffusionSR | ENCODER SWAP | multi_gstd data, encoder of diffusion_enc_multi_std (trained with standardize)
# Ablation v2 follow-up: does the field x norm interaction follow the encoder? The encoder is copied into <run>/encoder by followup_array.sh; encoder_results_dir below is unused (use_pretrained: false).
root_folder: /trace/group/forgelab/ngng/multifield/data_fields
downscale_method: direct
n_steps: '5'
residual_flag: false
schedule: linear
timesteps: 1000
batch_size: 40
epochs: 600
learning_rate: 5.0e-05
use_pretrained: false
loss_type: huber
normalize_method: global_standardize
fields: temperature_sdfliqlabel
encoding: true
conditioning: implicit
encoder_results_dir: /trace/group/forgelab/ngng/multifield/DiffusionSR_shohom/diffusionsr/runs/ablation_20260901/enc_multifield_global
encoder_normalize: standardize
