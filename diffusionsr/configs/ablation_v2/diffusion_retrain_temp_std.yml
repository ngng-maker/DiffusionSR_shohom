# DiffusionSR | ENCODER RETRAIN | temp_std, same config and seed as diffusion_enc_temp_std
# Ablation v2 follow-up: the original run's encoder stopped after 6 of 600 epochs (encoder-skip bug fixed in 2f4bd5e). followup_array.sh copies its encoder checkpoint into <run>/encoder so the encoder resumes to 600 epochs, then the diffusion stage trains from scratch.
root_folder: /trace/group/forgelab/ngng/multifield/data_fields
downscale_method: direct
n_steps: '5'
residual_flag: false
schedule: linear
timesteps: 1000
batch_size: 40
epochs: 600
learning_rate: 5.0e-05
use_pretrained: false
loss_type: huber
normalize_method: standardize
fields: temperature
encoding: true
conditioning: implicit
encoder_results_dir: /trace/group/forgelab/ngng/multifield/DiffusionSR_shohom/diffusionsr/runs/ablation_20260901/enc_temp
