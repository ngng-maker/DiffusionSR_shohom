# SS316L latent diffusion config (train_latentdiff.py).
# Schema kept consistent with the Experiment 11 reference config.
# Run from diffusionsr/:
#   python runners/train_latentdiff.py --config configs/ss316l_latentdiff_run.yml --gpu 0

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
root_folder: "./data/splits/ss316l_processed_3d_fields_seed20260518"
downscale_method: "direct"
n_steps: 1
out_steps: null
fields: [temperature, sdfliqlabel]
normalize_method: "standardize"
inflate_dim: null
inflate_method: "repeat"

# Forward-compatibility: read by newer pipeline versions of train_latentdiff.
# Harmless no-ops in the current runner; configure per-experiment when supported.
split_manifest: "split_manifest.csv"
trust_manifest: true
dataset_field_order: [temperature, liqlabel, pressure, vx, vy, vz]
crop_mode: "keyhole_wide"
temporal_last_n: 40
random_subsample_percent: 17
random_subsample_seed: 17
statistics_max_samples: 1024
statistics_seed: 0
statistics_workers: 8

# -----------------------------------------------------------------------------
# Frozen latent encoders
# NOTE: dirs below were trained on the old dataset; retrain VAEs on
# ss316l_processed_3d_fields_seed20260518 and update these paths.
# -----------------------------------------------------------------------------
latent_input_encoder_dir: "./runs/direct/vae2d/2026_05_18_16_32_16/standardize/n_steps_1"
latent_input_encoder_checkpoint: "best_model.pth"
latent_target_encoder_dir: "./runs/direct/vae2d/2026_05_18_15_42_18/standardize/n_steps_1"
latent_target_encoder_checkpoint: "best_model.pth"
latent_input_type: "upscaled_lr"
latent_target_type: "hr"
latent_sample_posterior: false

# -----------------------------------------------------------------------------
# Training mode
# -----------------------------------------------------------------------------
latent_training_mode: "diffusion"
latent_prediction_target: "target"
latent_architecture: "unet"
latent_overfit_mode: false
latent_overfit_sample_index: 1985

# Diffusion settings
latent_timesteps: 1000
latent_schedule: "cosine"
latent_sampler: "DDIM"
latent_sample_timesteps: 100
latent_ddim_eta: 0.0
latent_loss_type: "huber"

# Architecture
latent_hidden_channels: 64
latent_num_blocks: 2

# -----------------------------------------------------------------------------
# Optimizer and runtime
# -----------------------------------------------------------------------------
epochs: 600
batch_size: 16
learning_rate: 1.0e-4
latent_learning_rate: null
latent_weight_decay: 0.0
latent_grad_clip_norm: 1.0
latent_num_workers: 0

# -----------------------------------------------------------------------------
# Logging and checkpoints
# -----------------------------------------------------------------------------
latent_log_interval: 25
latent_sample_interval: 5
latent_preview_examples: 5
latent_save_every: 0
wandb_project: "Flow3D_SuperResolution"
wandb_mode: "online"
