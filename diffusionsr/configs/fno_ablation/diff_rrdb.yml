# Stage 2 - conditional diffusion on the frozen rrdb encoder
# RRDB CNN encoder - the paper's baseline. Reference arm for every comparison.
# Run: python -m diffusionsr.runners.train_srdiff --config <this> --modeltype diffusion
# encoder_type/encoder_kwargs MUST match enc_rrdb.yml exactly, or the stage-1
# checkpoint will not load into the rebuilt architecture.

root_folder: "/trace/group/forgelab/ngng/multifield/data_fields"
downscale_method: "direct"
n_steps: "1"
encoding: True
residual_flag: false
conditioning: "implicit"
normalize_method: "standardize"
schedule: "linear"
fields: "temperature"
timesteps: 1000
batch_size: 8
epochs: 300
learning_rate: 5e-5
use_pretrained: False
loss_type: "huber"
encoder_type: "rrdb"
encoder_results_dir: "/trace/group/forgelab/ngng/multifield/DiffusionSR_shohom/diffusionsr/runs/fno_ablation/enc_rrdb"
