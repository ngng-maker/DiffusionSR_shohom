# CALIBRATION ARM - FNO-A (upsample_mode: pre) under the PhysicsNeMo backend.
#
# Purpose: compared against enc_fno_pre.yml / diff_fno_pre.yml (the identical variant under the
# builtin backend), this isolates whether the backend choice is a confound. If they agree, the
# all-builtin primary arms are defensible and FNO-B (which requires builtin) stays in the study.
#
# SIZED 2026-09-23. Deliberately uses kwargs IDENTICAL to enc_fno_pre / diff_fno_pre
# (latent 32, modes [18,20], 4 layers) rather than the closest-to-target values the search tool
# reported. That is the point of a calibration arm: with identical hyperparameters the ONLY
# difference from the builtin arm is the implementation, so anything the comparison shows is
# attributable to the backend and nothing else.
#
# Measured on TRACE with physicsnemo installed:
#   physicsnemo  5,906,817 real DOF   (1.000x RRDB)
#   builtin      5,906,273 real DOF   (1.000x RRDB)
#   difference     544 params, 0.009% - the two implementations are capacity-equivalent at
#                  identical settings, so capacity is excluded as an explanation for any divergence.
#
# (An earlier naive numel() comparison made the two backends look ~2x apart. That was an artefact
# of physicsnemo storing spectral weights as real tensors while the builtin body stores them as
# complex64; counting real degrees of freedom normalises both.)
# Run: python -m diffusionsr.runners.train_srdiff --config <this> --modeltype encoder

root_folder: "/trace/group/forgelab/ngng/multifield/data_fields"
downscale_method: "direct"
n_steps: "1"
encoding: True
residual_flag: false
conditioning: "implicit"
normalize_method: "standardize"
schedule: "linear"
fields: "temperature"
timesteps: 1000
batch_size: 8
epochs: 300
learning_rate: 5e-5
use_pretrained: False
loss_type: "huber"
encoder_type: "fno"
encoder_kwargs:
  feature_channels: 64        # must equal the U-Net's init_dim (64 when enc_output is false)
  latent_channels: 32
  num_fno_layers: 4
  num_fno_modes: [18, 20]
  padding: 8
  upsample_mode: "pre"
  backend: "physicsnemo"      # the only difference from fno_pre
