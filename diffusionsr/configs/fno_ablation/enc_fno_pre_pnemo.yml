# CALIBRATION ARM - FNO-A (upsample_mode: pre) under the PhysicsNeMo backend.
#
# Purpose: compared against enc_fno_pre.yml / diff_fno_pre.yml (the identical variant under the
# builtin backend), this isolates whether the backend choice is a confound. If they agree, the
# all-builtin primary arms are defensible and FNO-B (which requires builtin) stays in the study.
#
# !! NOT YET SIZED - DO NOT TRUST THIS ARM UNTIL YOU DO THIS !!
# PhysicsNeMo's FNO has a different decoder, so these kwargs do NOT give RRDB's parameter count.
# On TRACE, with physicsnemo installed:
#   python -m diffusionsr.analysis.count_encoder_params --match 5904321 --backend physicsnemo
# and paste the reported latent_channels / num_fno_layers / num_fno_modes below (into BOTH the enc_
# and diff_ file, or stage 2 cannot load the stage-1 checkpoint).
# The tool now measures REAL degrees of freedom; an earlier revision measured torch numel(), which
# undercounts complex spectral weights ~2x. Re-run it even if you ran it before.#
# SIZING: matched against RRDB's 5,904,321 REAL degrees of freedom, not raw torch numel().
# The FNO's spectral weights are complex64; each element carries an independent real and imaginary
# part, so numel() undercounts them ~2x. An earlier revision of these configs matched on numel()
# and consequently gave every FNO arm ~2.02x RRDB's actual capacity. Verify with:
#   python -m diffusionsr.analysis.count_encoder_params
# Run: python -m diffusionsr.runners.train_srdiff --config <this> --modeltype encoder

root_folder: "/trace/group/forgelab/ngng/multifield/data_fields"
downscale_method: "direct"
n_steps: "1"
encoding: True
residual_flag: false
conditioning: "implicit"
normalize_method: "standardize"
schedule: "linear"
fields: "temperature"
timesteps: 1000
batch_size: 8
epochs: 300
learning_rate: 5e-5
use_pretrained: False
loss_type: "huber"
encoder_type: "fno"
encoder_kwargs:
  feature_channels: 64        # must equal the U-Net's init_dim (64 when enc_output is false)
  latent_channels: 32
  num_fno_layers: 4
  num_fno_modes: [18, 20]
  padding: 8
  upsample_mode: "pre"
  backend: "physicsnemo"      # PLACEHOLDER SIZE - see header
