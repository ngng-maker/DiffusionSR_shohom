# Stage 2 - conditional diffusion on the frozen fno_pre encoder
# FNO-A: bicubic-upsample LR to HR, then run the operator entirely at HR.
# Primary FNO variant. 80x80 working grid lifts the Nyquist mode ceiling to 40.
# Run: python -m diffusionsr.runners.train_srdiff --config <this> --modeltype diffusion
# encoder_type/encoder_kwargs MUST match enc_fno_pre.yml exactly, or the stage-1
# checkpoint will not load into the rebuilt architecture.

root_folder: "/trace/group/forgelab/ngng/multifield/data_fields"
downscale_method: "direct"
n_steps: "1"
encoding: True
residual_flag: false
conditioning: "implicit"
normalize_method: "standardize"
schedule: "linear"
fields: "temperature"
timesteps: 1000
batch_size: 8
epochs: 300
learning_rate: 5e-5
use_pretrained: False
loss_type: "huber"
encoder_type: "fno"
encoder_kwargs:
  feature_channels: 64        # must equal the U-Net's init_dim (64 when enc_output is false)
  latent_channels: 64
  num_fno_layers: 4
  num_fno_modes: [14, 13]     # sized to match RRDB's parameter count to within 1.5%
  padding: 8                  # non-periodic padding; melt-pool cross-sections do not wrap
  upsample_mode: "pre"
  backend: "auto"             # physicsnemo when installed (TRACE), builtin otherwise
encoder_results_dir: "/trace/group/forgelab/ngng/multifield/DiffusionSR_shohom/diffusionsr/runs/fno_ablation/enc_fno_pre"
