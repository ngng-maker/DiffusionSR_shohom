# DiffusionSR baseline, run in the IDENTICAL harness as si_opt_a_sigma010_enc_temp.yml.
#
# This file is derived from that config by changing ONE key: si_process. Every other value --
# encoder, conditioning, dataset, batch_size, epochs, learning_rate, loss, normalisation, EMA,
# gradient clipping, flip probability -- is byte-identical, so the only difference between the two
# runs is the generative process:
#
#   si_process: ddpm         x_t = sqrt(abar_t) x_0 + sqrt(1-abar_t) eps,  reverse Markov chain
#   si_process: interpolant  I_t = (1-t) x0 + t x1,                        Euler/Heun integration
#
# WHY NOT baseline_diffusionsr_temp.yml + --modeltype diffusion?
# Because DiffusionModel.train() has no EMA, no gradient clipping, a fixed LR instead of a per-step
# StepLR, and uses SimulationXZDataset instead of FlippedDataset. Comparing against that confounds
# the generative process with four harness differences -- EMA alone usually moves sample quality.
# Keep baseline_diffusionsr_temp.yml as the "as-published DiffusionSR" reference point; use THIS one
# for the attributable comparison.
#
# si_sigma is retained so the configs stay structurally identical, but it is ignored: a DDPM starts
# from pure noise and has no data-dependent base. si_gamma_c must stay 0 so the U-Net keeps the
# single-head out_dim = C that epsilon-prediction needs.
#
# Run: python -m diffusionsr.runners.train_srdiff --config <this> --modeltype coupled #        --force_enc_dir <...>/runs/fno_ablation/enc_rrdb

root_folder: "/trace/group/forgelab/ngng/multifield/data_fields"
downscale_method: "direct"
n_steps: "1"
residual_flag: false
normalize_method: "standardize"
schedule: "linear"
timesteps: 1000
batch_size: 40
epochs: 300
learning_rate: 2e-4
use_pretrained: False
loss_type: "l2"
fm_timescale: 1000.0
ema_decay: 0.999
grad_clip: 1.0
p_flip: 0.2
fields: "temperature"
encoding: True
conditioning: "implicit"
encoder_results_dir: "/trace/group/forgelab/ngng/multifield/DiffusionSR_shohom/diffusionsr/runs/fno_ablation/enc_rrdb"
si_sigma: 0.1
si_gamma_c: 0.0
si_cond: "enc_implicit"
si_process: "ddpm"
