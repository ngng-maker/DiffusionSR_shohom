root_folder: "../data/expanded_ss316l_all_laser_velocity_xz_cross_section_data_expanded_frame_4x"
downscale_method: "direct"
n_steps: "1"
encoding: True
residual_flag: false
conditioning: "implicit"

normalize_method: "standardize"
schedule: "linear"
fields: 'temperature'
timesteps: 1000
batch_size: 32
epochs: 300
learning_rate: 5e-5
use_pretrained: False

